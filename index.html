$('sv').onclick=async()=>{try{await db.doc(DOC_PATH).set({payload:JSON.stringify(D),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:user.email});dirty=false;st('Saved online '+new Date().toLocaleTimeString())}catch(x){alert('Save failed: '+x.message)}};
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='tfhs_audit_2024_25.json';a.click()};
$('cf').onclick=()=>ask('Firebase config (this browser only)',[['apiKey','apiKey'],['authDomain','authDomain'],['projectId','projectId'],['appId','appId']],v=>{localStorage.fbcfg=JSON.stringify(v);location.reload()});
window.onbeforeunload=e=>dirty?(e.preventDefault(),''):undefined;
$('nav').innerHTML=D.map((s,i)=>'<button onclick="show('+i+')">'+esc(s.n)+'</button>').join('');
const cfg=FB_FILE.apiKey?FB_FILE:JSON.parse(localStorage.fbcfg||'null');
if(cfg&&cfg.apiKey){firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(u=>{user=u;if(!u)edit=false;show(cur);ui()});
 db.doc(DOC_PATH).onSnapshot(s=>{if(s.exists&&!dirty){D=JSON.parse(s.data().payload);show(cur);checks();st('Online copy loaded')}else if(!s.exists)st('No online copy yet: sign in, edit and save to create it')},e=>st('Cannot read online copy: '+e.code))}
else st('Local copy');
show(0);checks();ui();
</script></body></html>
